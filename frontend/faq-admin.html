<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Admin - ComicTradersHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

        /* Header */
        .admin-header {
            background: linear-gradient(135deg, #1a0533, #3b0764);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #6d28d9;
        }
        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #fbbf24;
        }
        .admin-header a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .admin-header a:hover { color: #fbbf24; }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: #0f172a;
            border-radius: 10px;
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .stat-pill span { font-weight: 700; font-size: 1.1rem; }
        .stat-pill.total span { color: #818cf8; }
        .stat-pill.pending span { color: #fb923c; }
        .stat-pill.answered span { color: #4ade80; }

        /* Main */
        .admin-main { max-width: 900px; margin: 2rem auto; padding: 0 2rem; }

        /* Add FAQ manually */
        .add-box {
            background: #1e293b;
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid #fbbf24;
        }
        .add-box h3 { font-size: 1rem; font-weight: 700; color: #fbbf24; margin-bottom: 1rem; }
        .add-box input, .add-box textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            outline: none;
            transition: border-color 0.25s;
            box-sizing: border-box;
        }
        .add-box input:focus, .add-box textarea:focus { border-color: #6d28d9; }
        .add-box textarea { min-height: 80px; resize: vertical; }
        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #1a1a1a;
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-gold:hover { opacity: 0.88; }

        /* Tabs */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .tab {
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid #334155;
            color: #94a3b8;
            background: transparent;
            transition: all 0.2s;
        }
        .tab.active { background: #6d28d9; border-color: #6d28d9; color: white; }

        /* FAQ Cards */
        .faq-card {
            background: #1e293b;
            border-radius: 14px;
            padding: 1.4rem;
            margin-bottom: 1rem;
            border-left: 4px solid #334155;
            transition: border-color 0.3s;
        }
        .faq-card.pending { border-left-color: #fb923c; }
        .faq-card.answered { border-left-color: #4ade80; }

        .faq-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }
        .faq-card-header .q {
            font-weight: 600;
            font-size: 0.97rem;
            color: #e2e8f0;
            flex: 1;
        }
        .badge-status {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-status.pending { background: #431407; color: #fb923c; }
        .badge-status.answered { background: #052e16; color: #4ade80; }

        .faq-meta { font-size: 0.75rem; color: #64748b; margin-bottom: 0.8rem; }

        .existing-answer {
            background: #0f172a;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.88rem;
            color: #86efac;
            margin-bottom: 0.8rem;
            border-left: 3px solid #4ade80;
        }

        .answer-form textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            min-height: 80px;
            resize: vertical;
            outline: none;
            margin-bottom: 0.6rem;
            transition: border-color 0.25s;
            box-sizing: border-box;
        }
        .answer-form textarea:focus { border-color: #6d28d9; }

        .btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-answer {
            background: linear-gradient(135deg, #6d28d9, #4c1d95);
            color: white;
            border: none;
            padding: 0.55rem 1.2rem;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-answer:hover { opacity: 0.88; }
        .btn-delete {
            background: #450a0a;
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 0.55rem 1rem;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-delete:hover { background: #7f1d1d; }

        .empty { text-align: center; color: #475569; padding: 2rem; font-style: italic; }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1><i class="fas fa-store" style="color:#fbbf24;margin-right:0.5rem;"></i> FAQ Admin Panel</h1>
        <a href="faq.html"><i class="fas fa-eye"></i> View Public FAQ</a>
    </div>

    <div class="stats-bar">
        <div class="stat-pill total"><i class="fas fa-list" style="color:#818cf8;"></i> Total: <span id="totalCount">0</span></div>
        <div class="stat-pill pending"><i class="fas fa-clock" style="color:#fb923c;"></i> Pending: <span id="pendingCount">0</span></div>
        <div class="stat-pill answered"><i class="fas fa-check-circle" style="color:#4ade80;"></i> Answered: <span id="answeredCount">0</span></div>
    </div>

    <div class="admin-main">

        <!-- Add FAQ manually -->
        <div class="add-box">
            <h3><i class="fas fa-plus-circle"></i> Add FAQ Manually</h3>
            <input type="text" id="manualQ" placeholder="Enter question...">
            <textarea id="manualA" placeholder="Enter answer..."></textarea>
            <button class="btn-gold" onclick="addManual()"><i class="fas fa-plus"></i> Add FAQ</button>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="filterFAQs('all', this)">All</button>
            <button class="tab" onclick="filterFAQs('unanswered', this)">Pending</button>
            <button class="tab" onclick="filterFAQs('answered', this)">Answered</button>
        </div>

        <div id="faqAdminList"><div class="empty">Loading...</div></div>
    </div>

    <script>
        let allFAQs = [];
        let currentFilter = 'all';

        async function loadFAQs() {
            try {
                const res = await fetch('http://localhost:3000/api/faqs/all');
                allFAQs = await res.json();
                updateStats();
                renderFAQs();
            } catch {
                document.getElementById('faqAdminList').innerHTML = '<div class="empty">Could not connect to server.</div>';
            }
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = allFAQs.length;
            document.getElementById('pendingCount').textContent = allFAQs.filter(f => f.status === 'unanswered').length;
            document.getElementById('answeredCount').textContent = allFAQs.filter(f => f.status === 'answered').length;
        }

        function filterFAQs(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderFAQs();
        }

        function renderFAQs() {
            const list = document.getElementById('faqAdminList');
            const filtered = currentFilter === 'all' ? allFAQs : allFAQs.filter(f => f.status === currentFilter);
            if (!filtered.length) { list.innerHTML = '<div class="empty">No questions found.</div>'; return; }
            list.innerHTML = filtered.map(f => `
                <div class="faq-card ${f.status}" id="card-${f.id}">
                    <div class="faq-card-header">
                        <div class="q"><i class="fas fa-question-circle" style="color:#818cf8;margin-right:0.4rem;"></i>${f.question}</div>
                        <span class="badge-status ${f.status}">${f.status === 'answered' ? '✔ Answered' : '⏳ Pending'}</span>
                    </div>
                    <div class="faq-meta"><i class="fas fa-user" style="margin-right:0.3rem;"></i>${f.asked_by} &nbsp;|&nbsp; <i class="fas fa-clock" style="margin-right:0.3rem;"></i>${f.created_at}</div>
                    ${f.answer ? `<div class="existing-answer"><i class="fas fa-store" style="margin-right:0.4rem;"></i>${f.answer}</div>` : ''}
                    <div class="answer-form">
                        <textarea id="ans-${f.id}" placeholder="${f.answer ? 'Update answer...' : 'Write your answer...'}">${f.answer || ''}</textarea>
                        <div class="btn-row">
                            <button class="btn-answer" onclick="submitAnswer(${f.id})"><i class="fas fa-paper-plane"></i> ${f.answer ? 'Update' : 'Answer'}</button>
                            <button class="btn-delete" onclick="deleteFAQ(${f.id})"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function submitAnswer(id) {
            const answer = document.getElementById(`ans-${id}`).value.trim();
            if (!answer) { alert('Please write an answer.'); return; }
            await fetch(`http://localhost:3000/api/faqs/answer/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer })
            });
            loadFAQs();
        }

        async function deleteFAQ(id) {
            if (!confirm('Delete this FAQ?')) return;
            await fetch(`http://localhost:3000/api/faqs/${id}`, { method: 'DELETE' });
            loadFAQs();
        }

        async function addManual() {
            const question = document.getElementById('manualQ').value.trim();
            const answer = document.getElementById('manualA').value.trim();
            if (!question || !answer) { alert('Both question and answer are required.'); return; }
            const res = await fetch('http://localhost:3000/api/faqs/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, asked_by: 'Owner' })
            });
            const data = await res.json();
            await fetch(`http://localhost:3000/api/faqs/answer/${data.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answer })
            });
            document.getElementById('manualQ').value = '';
            document.getElementById('manualA').value = '';
            loadFAQs();
        }

        loadFAQs();
        setInterval(loadFAQs, 15000); // auto-refresh every 15s
    </script>
</body>
</html>
