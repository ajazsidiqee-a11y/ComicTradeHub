<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 68" width="260" height="68">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c75"/>
      <stop offset="50%" style="stop-color:#1b6ca8"/>
      <stop offset="100%" style="stop-color:#0d7377"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe259"/>
      <stop offset="100%" style="stop-color:#ffa751"/>
    </linearGradient>
    <linearGradient id="comicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffe259"/>
      <stop offset="100%" style="stop-color:#ffa751"/>
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe259"/>
      <stop offset="100%" style="stop-color:#ffa751"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shadow -->
  <rect x="2" y="5" width="256" height="58" rx="16" fill="rgba(0,0,0,0.25)" filter="url(#shadow)"/>

  <!-- Main background -->
  <rect x="0" y="2" width="260" height="58" rx="16" fill="url(#bgGrad)"/>

  <!-- Top shine -->
  <rect x="0" y="2" width="260" height="28" rx="16" fill="rgba(255,255,255,0.07)"/>

  <!-- Border -->
  <rect x="1" y="3" width="258" height="56" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>

  <!-- Icon background circle -->
  <circle cx="34" cy="31" r="21" fill="rgba(255,255,255,0.12)" stroke="url(#iconGrad)" stroke-width="1.8"/>

  <!-- Store icon -->
  <g transform="translate(22, 18)" filter="url(#glow)">
    <!-- Roof triangle -->
    <polygon points="12,0 24,9 0,9" fill="url(#iconGrad)"/>
    <!-- Body -->
    <rect x="2" y="9" width="20" height="14" rx="1.5" fill="#ffe259"/>
    <!-- Door -->
    <rect x="8.5" y="14" width="7" height="9" rx="1" fill="#0f4c75"/>
    <!-- Left window -->
    <rect x="3" y="11" width="4.5" height="4.5" rx="0.8" fill="rgba(255,255,255,0.75)"/>
    <!-- Right window -->
    <rect x="16.5" y="11" width="4.5" height="4.5" rx="0.8" fill="rgba(255,255,255,0.75)"/>
    <!-- Door knob -->
    <circle cx="14.5" cy="19" r="0.9" fill="#ffe259"/>
  </g>

  <!-- Vertical divider -->
  <line x1="64" y1="14" x2="64" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- COMIC text -->
  <text x="74" y="30"
    font-family="'Trebuchet MS', 'Franklin Gothic Medium', Arial, sans-serif"
    font-size="20"
    font-weight="900"
    fill="url(#comicGrad)"
    letter-spacing="2">COMIC</text>

  <!-- TRADERS text -->
  <text x="75" y="48"
    font-family="'Trebuchet MS', 'Franklin Gothic Medium', Arial, sans-serif"
    font-size="12"
    font-weight="600"
    fill="rgba(255,255,255,0.88)"
    letter-spacing="5">TRADERS</text>

  <!-- Dot separator -->
  <circle cx="183" cy="31" r="3" fill="#ffa751"/>

  <!-- HUB badge -->
  <rect x="190" y="17" width="46" height="22" rx="11" fill="url(#hubGrad)"/>
  <rect x="191" y="18" width="44" height="20" rx="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  <text x="213" y="32"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="11"
    font-weight="900"
    fill="#0f4c75"
    text-anchor="middle"
    letter-spacing="1.5">HUB</text>

</svg>
