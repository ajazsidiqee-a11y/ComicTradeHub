<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ComicTradersHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(109,40,217,0.2) 0%, transparent 60%);
            top: -150px; left: -150px; border-radius: 50%; pointer-events: none;
        }
        body::after {
            content: ''; position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 60%);
            bottom: -50px; right: -50px; border-radius: 50%; pointer-events: none;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
        }
        .login-card h2 {
            font-size: 1.8rem;
            color: #fbbf24;
            text-align: center;
            margin-bottom: 0.2rem;
            font-family: 'Playfair Display', serif;
        }
        .login-card p {
            text-align: center;
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        label { 
            font-size: 0.75rem; color: #94a3b8; display: block; 
            margin-bottom: 0.4rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: #e2e8f0;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }
        input:focus { 
            border-color: #a78bfa; 
            background: rgba(15, 23, 42, 0.9);
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #6d28d9, #4c1d95);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
            margin-top: 0.5rem;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(109, 40, 217, 0.6);
        }
        .error {
            background: #450a0a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.8rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fas fa-user-shield"></i> Admin Access</h2>
        <p>ComicTradersHub Dashboard</p>
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>
        <button id="loginBtn" onclick="login()">Login to Dashboard</button>
        <div class="error" id="errorMsg">Invalid username or password.</div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            errorMsg.style.display = 'none';
            
            if (!email || !password) {
                errorMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> Please enter both email and password.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            try {
                const res = await fetch('http://localhost:3000/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('adminLoggedIn', 'true');
                    window.location.href = 'admin-enhanced.html';
                } else {
                    errorMsg.innerHTML = '<i class="fas fa-times-circle"></i> ' + (data.error || 'Invalid credentials.');
                    errorMsg.style.display = 'block';
                }
            } catch (e) {
                errorMsg.innerHTML = '<i class="fas fa-plug"></i> Server not running. Start with npm start.';
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Login to Dashboard';
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
